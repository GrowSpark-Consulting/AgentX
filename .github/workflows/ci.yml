name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job names are the required status checks in branch protection; rename both together.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Starts Postgres and applies every file in supabase/migrations from scratch.
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase db lint --level error
      # Rebuild from scratch with the seed (supabase/seed/*), as a new machine would.
      - run: pnpm exec supabase db reset
      # pgTAP tests in supabase/tests: tenant isolation, RLS on every table, seed contents.
      - run: pnpm exec supabase test db
