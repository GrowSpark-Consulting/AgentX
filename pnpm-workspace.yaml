packages:
  - frontend
  - backend
  - packages/*

allowBuilds:
  sharp: false
  unrs-resolver: false
  # CLIs below download their native binary in postinstall
  supabase: true
  inngest-cli: true
  # pulled in by inngest's telemetry deps; its postinstall is only a version check
  protobufjs: false
  # tsx's compiler; its platform binary comes as an optional dependency, the postinstall only optimizes lookup
  esbuild: false

packageExtensions:
  # eslint-config-next loads next's bundled Babel parser but doesn't declare `next`. Declaring it as
  # a peer lets pnpm link the frontend's `next` instead of relying on a hoisted copy at the root.
  eslint-config-next:
    peerDependencies:
      next: "*"
