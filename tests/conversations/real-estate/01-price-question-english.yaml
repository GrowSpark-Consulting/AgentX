name: English price question is answered from the knowledge base only
description: A customer asks the price of a 2BHK in a place. The reply comes from the knowledge-base text, with no price the text does not have.
kb:
  - "2BHK of 950 sq ft in Velachery starts at ₹78 lakh. Site visits are free on weekdays."
turns:
  - customer: "What is the price of a 2BHK in Velachery?"
    mock:
      extraction:
        language: en
        intent: question
        fields: { location: Velachery, config: 2BHK }
        question: "What is the price of a 2BHK in Velachery?"
      reply: "A 2BHK in Velachery starts at ₹78 lakh. Would you like to plan a site visit?"
    expect:
      extracted: { intent: question, language: en }
      reply: { sent: true }
      noInventedPrice: true
      aiReplies: 1
      handoff: null
    mockOnly:
      extracted: { fields: { location: Velachery, config: 2BHK } }
      case: answered_from_kb
      reply: { contains: ["₹78 lakh"], notice: false }
      leadFields: { location: Velachery, config: 2BHK }
      leadStage: engaged
