name: By default the first reply has no privacy notice and nothing is logged as shown
description: Disabled by default per Raja (9 Oct); a business can switch it on (see 08).
kb:
  - "2BHK of 950 sq ft in Velachery starts at ₹78 lakh."
contact:
  alreadySawNotice: false
turns:
  - customer: "2BHK price in Velachery?"
    mock:
      extraction: { language: en, intent: question, question: "What is the price of a 2BHK in Velachery?" }
      reply: "A 2BHK in Velachery starts at ₹78 lakh. Shall we plan a site visit?"
    expect:
      reply: { sent: true, notice: false }
      consent: []
      aiReplies: 1
  - customer: "ok and the site visit timing?"
    mock:
      extraction: { language: en, intent: question, question: "What are the site visit timings?" }
      reply: "Site visits are free on weekdays. Which day suits you?"
    expect:
      reply: { sent: true, notice: false }
      consent: []
    mockOnly:
      case: answered_from_kb
