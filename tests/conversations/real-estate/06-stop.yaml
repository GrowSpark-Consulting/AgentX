name: STOP opts out, gets one confirmation and no reply, and staff are told
kb:
  - "2BHK of 950 sq ft in Velachery starts at ₹78 lakh."
turns:
  - customer: "Hi, 2BHK price in Velachery?"
    mock:
      extraction: { language: en, intent: question, question: "What is the price of a 2BHK in Velachery?" }
      reply: "A 2BHK in Velachery starts at ₹78 lakh. Shall we plan a site visit?"
    expect:
      reply: { sent: true }
      optedOut: false
      aiReplies: 1
  - customer: "STOP"
    expect:
      stop: true
      optedOut: true
      consent: [{ event: opted_out, source: stop_keyword }]
      handoff: { trigger: opt_out, priority: high }
      aiReplies: 0
      confirmations: 1
  - customer: "hello? are you there"
    expect:
      aiReplies: 0
      confirmations: 0
      optedOut: true
