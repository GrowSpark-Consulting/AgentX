name: An off-topic message gets a polite decline and no price
kb:
  - "2BHK of 950 sq ft in Velachery starts at ₹78 lakh."
turns:
  - customer: "Who is going to win the cricket match today?"
    mock:
      extraction:
        language: en
        intent: off_topic
      reply: "I can only help with homes and our projects. Would you like to know about a 2BHK?"
    expect:
      extracted: { intent: off_topic }
      reply: { sent: true, notContains: ["₹"] }
      aiReplies: 1
      handoff: null
      mode: ai
    mockOnly:
      case: off_topic
