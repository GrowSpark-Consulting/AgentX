name: "English: \"Remove my number from your list right now.\" is an opt-out (Raja's phrase 3: phrase 1, \"Stop messaging me\", is a STOP phrase caught by the keyword list, see 06)"
description: "Raja's phrase list (docs/reference/opt-out-handoff-phrases.md). Mock mode checks what the code does with a clear opt-out; --live shows what the real model makes of the phrase."
turns:
  - customer: "Remove my number from your list right now."
    mock:
      extraction: { language: en, intent: opt_out, confidence: 0.95 }
    expect:
      extracted: { intent: opt_out }
      optedOut: true
      aiReplies: 0
    mockOnly:
      consent: [{ event: opted_out, source: model_intent }]
      handoff: { trigger: opt_out, priority: high }
      confirmations: 1
